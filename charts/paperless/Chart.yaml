apiVersion: v2
name: paperless
description: Paperless-ngx document management, based on the bjw-s common library
type: application
version: 1.0.0
appVersion: 3.0.5
kubeVersion: ">=1.28.0-0"
home: https://docs.paperless-ngx.com/
sources:
  - https://github.com/paperless-ngx/paperless-ngx
dependencies:
  - name: common
    version: 4.6.2
    repository: https://bjw-s-labs.github.io/helm-charts/
  - name: postgresql
    version: 15.5.21
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: cluster
    alias: cloudnativepg
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnativepg.enabled
  - name: tika
    version: 4.0.0
    repository: oci://apache.jfrog.io/tika-helm
    condition: documentParsing.tika.enabled
  - name: gotenberg
    version: 1.30.0
    repository: https://maikumori.github.io/helm-charts
    condition: documentParsing.gotenberg.enabled
