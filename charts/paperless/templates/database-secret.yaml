{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless.dbSecretName" . }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
{{- end -}}
