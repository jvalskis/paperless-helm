name: Validate chart

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.6
      - name: Add chart repository
        run: helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts/
      - name: Build dependencies
        run: helm dependency build charts/paperless
      - name: Lint chart
        run: helm lint --strict charts/paperless
      - name: Render default chart
        run: helm template paperless charts/paperless --namespace paperless > /tmp/paperless.yaml
