name: Validate chart

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.6
      - name: Add chart repositories
        run: |
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts/
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
      - name: Build dependencies
        run: helm dependency build charts/paperless
      - name: Lint chart
        run: helm lint --strict charts/paperless
      - name: Render default chart
        run: helm template paperless charts/paperless --namespace paperless > /tmp/paperless.yaml
      - name: Create Kubernetes cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
          kubectl_version: v1.32.2
      - name: Test database modes in Kubernetes
        run: bash .github/scripts/database-integration.sh
      - name: Show Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get clusters.postgresql.cnpg.io -A || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          for namespace in paperless-sqlite paperless-postgresql paperless-external-postgresql paperless-external-mariadb paperless-cloudnativepg; do
            kubectl --namespace "$namespace" logs deployment/paperless --all-containers=true --tail=100 || true
          done
          kubectl --namespace paperless-external-postgresql logs pod/postgres --tail=100 || true
          kubectl --namespace paperless-external-mariadb logs pod/mariadb --tail=100 || true
