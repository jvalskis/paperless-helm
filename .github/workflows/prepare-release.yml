name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version, for example 0.2.0
        required: true
        type: string
      app_version:
        description: Optional Paperless version, for example 3.0.6
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Set RELEASE_TOKEN with contents:write and pull-requests:write permissions.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Check versions and update chart metadata
        env:
          CHART_VERSION: ${{ inputs.version }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$CHART_VERSION" =~ $semver ]] || exit 1
          if [ -n "$APP_VERSION" ]; then
            [[ "$APP_VERSION" =~ $semver ]] || exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          path = Path('charts/paperless/Chart.yaml')
          text = path.read_text()
          text = re.sub(r'^version: .+$', 'version: ' + os.environ['CHART_VERSION'], text, count=1, flags=re.M)
          if os.environ['APP_VERSION']:
              text = re.sub(r'^appVersion: .+$', 'appVersion: ' + os.environ['APP_VERSION'], text, count=1, flags=re.M)
          path.write_text(text)
          PY
      - name: Create release preparation pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CHART_VERSION: ${{ inputs.version }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          branch="prepare-release-v$CHART_VERSION"
          title="Prepare chart v$CHART_VERSION"
          body="Updates the Paperless chart metadata for release v$CHART_VERSION."
          if [ -n "$APP_VERSION" ]; then
            title="$title; bump Paperless to v$APP_VERSION"
            body="$body Bumps Paperless to v$APP_VERSION."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add charts/paperless/Chart.yaml
          git diff --cached --quiet && { echo 'Version is unchanged.' >&2; exit 1; }
          git commit -m "chore(release): prepare v$CHART_VERSION"
          git push --force origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
              --title "$title" \
              --body "$body"
          fi
