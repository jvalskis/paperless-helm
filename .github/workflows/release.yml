name: Release chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.6
      - name: Add chart repository
        run: helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts/
      - name: Check tag and chart version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chart_version=$(helm show chart charts/paperless | sed -n 's/^version: *//p' | head -1)
          test "$RELEASE_TAG" = "v$chart_version"
      - name: Build and validate chart
        run: |
          helm dependency build charts/paperless
          helm lint --strict charts/paperless
          helm template paperless charts/paperless --namespace paperless > /tmp/paperless.yaml
          helm package charts/paperless --destination /tmp
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish OCI chart
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          chart_version=$(helm show chart charts/paperless | sed -n 's/^version: *//p' | head -1)
          helm push "/tmp/paperless-${chart_version}.tgz" "oci://ghcr.io/${REPOSITORY,,}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes /tmp/paperless-*.tgz
