name: Release Charts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: release-charts
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag matches chart version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chart_file=charts/paperless/Chart.yaml
          if [ ! -f "$chart_file" ]; then
            echo "Chart metadata not found: $chart_file" >&2
            exit 1
          fi
          chart_version=$(sed -n 's/^version: *//p' "$chart_file" | head -n 1 | tr -d '"\r')
          if [ "$RELEASE_TAG" != "v$chart_version" ]; then
            echo "Release tag $RELEASE_TAG does not match chart version $chart_version" >&2
            exit 1
          fi

      - name: Configure Git
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add chart repositories
        run: |
          helm repo add bjw-s-labs https://bjw-s-labs.github.io/helm-charts/
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm repo add tika https://apache.jfrog.io/artifactory/tika
          helm repo add maikumori https://maikumori.github.io/helm-charts

      - name: Run chart-releaser
        uses: bitdeps/helm-oci-charts-releaser@v0.1.5
        with:
          charts_dir: charts
          oci_registry: ghcr.io/${{ github.repository }}
          oci_username: ${{ github.actor }}
          oci_password: ${{ secrets.GITHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_gh_release: true
